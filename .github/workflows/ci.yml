name: Numerical and controller checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/test-showcase-data.py
      - run: python -m evals.run --mode deterministic --split test
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-evaluation
          path: evals/results/deterministic.json
  frontend:
    runs-on: ubuntu-latest
    env:
      METRICPILOT_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-dashboard.cjs
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/test-static-export.cjs '' "$METRICPILOT_SOURCE_REF"
